<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN手绘草图识别系统</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
        }
        body {
            height: 100vh;
            overflow: hidden;
            /* 🌿 小清新：薄荷 + 天蓝 + 奶油 + 淡粉 的柔和渐变 */
            background-color: #f2faf6;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(168, 230, 207, 0.55), transparent 40%),
                radial-gradient(circle at 85% 12%, rgba(190, 227, 248, 0.50), transparent 42%),
                radial-gradient(circle at 78% 88%, rgba(255, 218, 185, 0.42), transparent 40%),
                radial-gradient(circle at 18% 92%, rgba(255, 209, 220, 0.42), transparent 42%);
        }
        /* 粒子画布 */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        /* 首页容器 */
        .home-wrap {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        /* 首页卡片 */
        .home-card {
            position: relative;
            text-align: center;
            background: rgba(255, 255, 255, 0.72);
            padding: 62px 84px 56px;
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 24px 60px rgba(91, 165, 140, 0.14),
                0 8px 20px rgba(91, 165, 140, 0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(-30px) scale(0.96);
        }
        .home-card::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 42px;
            background: linear-gradient(135deg,
                rgba(168, 230, 207, 0.55),
                rgba(190, 227, 248, 0.55),
                rgba(255, 209, 220, 0.55));
            filter: blur(24px);
            z-index: -1;
            opacity: 0.75;
        }
        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .home-card h1 {
            font-size: 40px;
            font-weight: 600;
            letter-spacing: 3px;
            line-height: 1.35;
            margin-bottom: 14px;
            background: linear-gradient(120deg, #3a9e7f 0%, #57b9c9 55%, #c88fa8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 10px rgba(91, 191, 158, 0.18));
        }
        .home-card .subtitle {
            color: #7aa89a;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 42px;
            font-weight: 400;
        }
        #startBtn {
            position: relative;
            padding: 17px 56px;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #56c0a0, #7ec8b0);
            color: #fff;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow:
                0 10px 24px rgba(86, 192, 160, 0.32),
                0 4px 8px rgba(86, 192, 160, 0.16);
        }
        #startBtn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #4fb897, #72c4aa);
            box-shadow:
                0 16px 32px rgba(86, 192, 160, 0.40),
                0 6px 12px rgba(86, 192, 160, 0.20);
        }
        #startBtn:active {
            transform: translateY(-1px) scale(0.99);
            box-shadow: 0 6px 16px rgba(86, 192, 160, 0.30);
        }
        .deco-dot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .deco-dot.d1 { width: 14px; height: 14px; background: rgba(168, 230, 207, 0.85); top: 26px; left: 30px; }
        .deco-dot.d2 { width: 10px; height: 10px; background: rgba(255, 209, 220, 0.9); bottom: 28px; right: 34px; }
        .deco-dot.d3 { width: 8px; height: 8px; background: rgba(190, 227, 248, 0.95); top: 42px; right: 46px; }
        .float-bubble {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .float-bubble.b1 {
            width: 130px; height: 130px;
            background: radial-gradient(circle at 32% 32%, rgba(168, 230, 207, 0.75), transparent 70%);
            top: -54px; left: -66px;
            animation: floaty 6s ease-in-out infinite;
        }
        .float-bubble.b2 {
            width: 96px; height: 96px;
            background: radial-gradient(circle at 32% 32%, rgba(255, 209, 220, 0.75), transparent 70%);
            bottom: -42px; right: -46px;
            animation: floaty 7s ease-in-out infinite reverse;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* ========== 游戏主界面（小清新版） ========== */
        .game-wrap {
            position: fixed;
            z-index: 3;
            width: 100vw;
            height: 100vh;
            /* 和首页同色系，但更淡一点，避免抢戏 */
            background-color: #f4fbf8;
            background-image:
                radial-gradient(circle at 12% 15%, rgba(168, 230, 207, 0.35), transparent 45%),
                radial-gradient(circle at 88% 10%, rgba(190, 227, 248, 0.35), transparent 45%),
                radial-gradient(circle at 82% 90%, rgba(255, 218, 185, 0.28), transparent 45%),
                radial-gradient(circle at 15% 88%, rgba(255, 209, 220, 0.28), transparent 45%);
            padding: 32px 32px 40px;
            overflow: auto;
            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .game-wrap.active {
            transform: translateY(0);
        }

        /* 返回按钮：小清新描边胶囊 */
        .back-btn {
            position: absolute;
            top: 26px;
            left: 32px;
            z-index: 10;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 999px;
            border: 1.5px solid rgba(86, 192, 160, 0.55);
            background: rgba(255, 255, 255, 0.85);
            color: #3a9e7f;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
        }
        .back-btn:hover {
            background: linear-gradient(135deg, #56c0a0, #7ec8b0);
            color: #fff;
            border-color: transparent;
            transform: translateX(-4px);
            box-shadow: 0 8px 20px rgba(86, 192, 160, 0.28);
        }

        /* 游戏页大标题：也用渐变文字，和首页呼应 */
        .game-wrap h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 28px;
            text-align: center;
            background: linear-gradient(120deg, #3a9e7f 0%, #57b9c9 60%, #c88fa8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 10px rgba(91, 191, 158, 0.15));
        }

        .main-wrap {
            display: flex;
            gap: 28px;
            justify-content: center;
            align-items: flex-start;
        }

        /* 左侧模式按钮 */
        .mode-panel {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 4px;
        }
        .mode-btn {
            width: 100%;
            padding: 20px 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 18px;
            border: 1.5px solid rgba(86, 192, 160, 0.45);
            background: rgba(255, 255, 255, 0.85);
            color: #3a9e7f;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(6px);
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #56c0a0, #7ec8b0);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 10px 22px rgba(86, 192, 160, 0.28);
        }
        .mode-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(86, 192, 160, 0.20);
        }

        /* 中间画布区 */
        .draw-wrap {
            flex: 0 0 400px;
        }
        canvas#sketchCanvas {
            border: none;
            background: #0b1222;
            border-radius: 20px;
            display: block;
            touch-action: none;
            box-shadow:
                0 16px 40px rgba(91, 165, 140, 0.18),
                0 4px 10px rgba(91, 165, 140, 0.08);
        }
        .draw-btn-row {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .draw-btn-row button {
            padding: 11px 26px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        #submitBtn {
            background: linear-gradient(135deg, #56c0a0, #7ec8b0);
            color: #fff;
            box-shadow: 0 8px 18px rgba(86, 192, 160, 0.28);
        }
        #submitBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(86, 192, 160, 0.36);
        }
        #clearCanvasBtn {
            background: rgba(255, 255, 255, 0.9);
            color: #7aa89a;
            border: 1.5px solid rgba(122, 168, 154, 0.35);
        }
        #clearCanvasBtn:hover {
            background: #f0f7f4;
            transform: translateY(-2px);
        }

        /* 右侧信息面板 */
        .info-panel {
            flex: 1;
            min-width: 320px;
        }
        .panel {
            background: rgba(255, 255, 255, 0.82);
            padding: 22px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 10px 28px rgba(91, 165, 140, 0.10),
                0 2px 6px rgba(91, 165, 140, 0.05);
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
        }
        .panel h3 {
            color: #2f7f68;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .panel h4 {
            color: #2f7f68;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .panel div,
        .panel p {
            color: #4a6b62;
            line-height: 1.7;
            font-size: 14px;
        }
        /* 关卡列表标签 */
        .level-tag {
            display: inline-block;
            padding: 5px 12px;
            margin: 4px 4px 4px 0;
            border: 1.5px solid rgba(122, 168, 154, 0.40);
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            color: #5a8578;
            background: rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }
        .level-tag:hover {
            background: #e6f5ef;
            transform: translateY(-1px);
        }
        .level-tag.passed {
            background: linear-gradient(135deg, #56c0a0, #7ec8b0);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(86, 192, 160, 0.25);
        }
        .success {
            color: #2f9e6f;
            font-weight: bold;
        }
        .fail {
            color: #d97070;
            font-weight: bold;
        }
    </style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<!-- 首页 -->
<div class="home-wrap" id="homePage">
    <div class="home-card">
        <span class="float-bubble b1"></span>
        <span class="float-bubble b2"></span>
        <span class="deco-dot d1"></span>
        <span class="deco-dot d2"></span>
        <span class="deco-dot d3"></span>

        <h1>CNN手绘草图识别系统</h1>
        <p class="subtitle">随手画几笔，让 AI 猜猜看</p>
        <button id="startBtn">开始游戏</button>
    </div>
</div>

<!-- 游戏页面 -->
<div class="game-wrap" id="gamePage">
    <button class="back-btn" id="backBtn">← 返回首页</button>
    <h1>CNN手绘草图识别系统</h1>
    <div class="main-wrap">
        <div class="mode-panel">
            <button class="mode-btn active" data-mode="challenge">闯关模式</button>
            <button class="mode-btn" data-mode="chain">词语接龙</button>
            <button class="mode-btn" data-mode="practice">练习模式</button>
        </div>
        <div class="draw-wrap">
            <canvas id="sketchCanvas" width="380" height="380"></canvas>
            <div class="draw-btn-row">
                <button id="clearCanvasBtn">清空画布</button>
                <button id="submitBtn">提交草图</button>
            </div>
        </div>
        <div class="info-panel">
            <div class="panel">
                <h3 id="modeTitle">闯关模式</h3>
                <div id="modeHint">当前关卡：<span id="lid">1</span>｜请画：<span id="targetZh">星星</span>（<span id="targetEn">star</span>）</div>
                <div style="margin-top:8px; color:#7aa89a; font-size:13px;">模式：平衡模式（top1匹配，置信度≥0.5 通过）</div>
            </div>
            <div class="panel">
                <h4>📌 识别反馈</h4>
                <p id="msg">绘制草图后点击提交</p>
                <div id="top3Box"></div>
            </div>
            <div id="progressPanel" class="panel">
                <h4>📊 进度信息</h4>
                <div>已通关：<span id="passCount">0</span> / <span id="totalLevel">10</span></div>
            </div>
            <div id="levelListPanel" class="panel">
                <h4>📖 关卡列表（绿色=已通关）</h4>
                <div id="levelBox"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ============ 粒子背景（浅色气泡风） ============
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w, h;
let particles = [];

const palette = [
    "rgba(168, 230, 207, 0.75)",
    "rgba(190, 227, 248, 0.70)",
    "rgba(255, 218, 185, 0.68)",
    "rgba(255, 209, 220, 0.68)",
    "rgba(220, 237, 200, 0.70)"
];

function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle{
    constructor(){
        this.reset(true);
    }
    reset(init){
        this.x = Math.random() * w;
        this.y = init ? Math.random() * h : h + 10;
        this.r = Math.random() * 3.2 + 1.2;
        this.speedX = (Math.random() - 0.5) * 0.28;
        this.speedY = (Math.random() - 0.5) * 0.28;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.pulse = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.006 + Math.random() * 0.008;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x < -20) this.x = w + 20;
        if(this.x > w + 20) this.x = -20;
        if(this.y < -20) this.y = h + 20;
        if(this.y > h + 20) this.y = -20;
        this.pulse += this.pulseSpeed;
    }
    draw(){
        const r = this.r + Math.sin(this.pulse) * 0.6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.5, r), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}
for(let i = 0; i < 90; i++) particles.push(new Particle());

function animate(){
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

// ============ 页面切换 ============
const homePage = document.getElementById("homePage");
const gamePage = document.getElementById("gamePage");

document.getElementById("startBtn").onclick = function(){
    homePage.style.opacity = "0";
    setTimeout(()=>{
        homePage.style.display = "none";
        gamePage.classList.add("active");
    }, 600);
};

document.getElementById("backBtn").onclick = function(){
    gamePage.classList.remove("active");
    setTimeout(()=>{
        homePage.style.display = "flex";
        homePage.style.opacity = "0";
        void homePage.offsetWidth;
        homePage.style.opacity = "1";
    }, 700);
};

// ============ 游戏逻辑 ============
const levelData = [
    {id:1, class_name:"star", display_name:"星星", difficulty:1, pass_threshold:0.5},
    {id:2, class_name:"hand", display_name:"手", difficulty:1, pass_threshold:0.5},
    {id:3, class_name:"apple", display_name:"苹果", difficulty:2, pass_threshold:0.5},
    {id:4, class_name:"sun", display_name:"太阳", difficulty:2, pass_threshold:0.5},
    {id:5, class_name:"house", display_name:"房子", difficulty:3, pass_threshold:0.5},
    {id:6, class_name:"tree", display_name:"树", difficulty:3, pass_threshold:0.5},
    {id:7, class_name:"flower", display_name:"花", difficulty:3, pass_threshold:0.5},
    {id:8, class_name:"bird", display_name:"鸟", difficulty:4, pass_threshold:0.5},
    {id:9, class_name:"dog", display_name:"狗", difficulty:4, pass_threshold:0.5},
    {id:10, class_name:"cat", display_name:"猫", difficulty:5, pass_threshold:0.5},
];
const chainDict = {
    a:["apple"],b:["bird"],c:["cat"],d:["dog"],f:["flower"],h:["hand","house"],s:["star","sun"],t:["tree"]
};
let progress = {};
let currentLevelId = 1;
let currentMode = "challenge";
let chainState = {requiredLetter:"", startWord:""};

// ============ 绘图画布 ============
const sketchCanvas = document.getElementById("sketchCanvas");
const sketchCtx = sketchCanvas.getContext("2d");
let drawing = false;
let strokes = [];
let currentStroke = [];
sketchCtx.lineWidth = 4;
sketchCtx.strokeStyle = "#fff";
sketchCtx.lineCap = "round";
sketchCtx.lineJoin = "round";

function getPos(e){
    const rect = sketchCanvas.getBoundingClientRect();
    const scaleX = sketchCanvas.width / rect.width;
    const scaleY = sketchCanvas.height / rect.height;
    return [
        Math.round((e.clientX - rect.left) * scaleX),
        Math.round((e.clientY - rect.top) * scaleY)
    ];
}

sketchCanvas.addEventListener("pointerdown", e=>{
    e.preventDefault();
    if(sketchCanvas.setPointerCapture) sketchCanvas.setPointerCapture(e.pointerId);
    drawing = true;
    currentStroke = [getPos(e)];
    redrawCanvas();
});
sketchCanvas.addEventListener("pointermove", e=>{
    if(!drawing) return;
    e.preventDefault();
    const [x,y] = getPos(e);
    const last = currentStroke[currentStroke.length-1];
    if(!last || Math.hypot(x-last[0], y-last[1]) > 2){
        currentStroke.push([x,y]);
    }
    redrawCanvas();
});
function endStroke(){
    if(!drawing) return;
    drawing = false;
    if(currentStroke.length > 0) strokes.push(currentStroke);
    currentStroke = [];
    redrawCanvas();
}
sketchCanvas.addEventListener("pointerup", endStroke);
sketchCanvas.addEventListener("pointercancel", endStroke);
sketchCanvas.addEventListener("pointerleave", endStroke);

function redrawCanvas(){
    sketchCtx.clearRect(0,0,sketchCanvas.width,sketchCanvas.height);
    const all = currentStroke.length ? strokes.concat([currentStroke]) : strokes;
    all.forEach(stroke=>{
        if(!stroke || stroke.length === 0) return;
        sketchCtx.beginPath();
        if(stroke.length === 1){
            sketchCtx.arc(stroke[0][0], stroke[0][1], sketchCtx.lineWidth/2, 0, Math.PI*2);
            sketchCtx.fillStyle = "#fff";
            sketchCtx.fill();
            return;
        }
        sketchCtx.moveTo(stroke[0][0], stroke[0][1]);
        for(let i=1;i<stroke.length;i++){
            sketchCtx.lineTo(stroke[i][0], stroke[i][1]);
        }
        sketchCtx.stroke();
    });
}

function clearCanvas(){
    strokes = [];
    currentStroke = [];
    sketchCtx.clearRect(0,0,sketchCanvas.width,sketchCanvas.height);
}
document.getElementById("clearCanvasBtn").onclick = clearCanvas;

// ============ 模拟预测 ============
function mockPredict(strokes, targetClassName){
    const count = strokes.length;
    const map = {};
    levelData.forEach(l=> map[l.class_name] = l.display_name);
    const list = levelData.map(x=>x.class_name);
    let top5 = [];
    if(count >= 3){
        const conf = (Math.random()*0.35 + 0.55).toFixed(2);
        top5.push({class_name:targetClassName, display_name:map[targetClassName], conf:Number(conf)});
        const rest = list.filter(c=>c !== targetClassName);
        shuffle(rest).slice(0,4).forEach(c=>{
            const rConf = (Math.random()*0.45).toFixed(2);
            top5.push({class_name:c, display_name:map[c], conf:Number(rConf)});
        });
    }else{
        shuffle(list).slice(0,5).forEach(c=>{
            const rConf = (Math.random()*0.42).toFixed(2);
            top5.push({class_name:c, display_name:map[c], conf:Number(rConf)});
        });
    }
    top5.sort((a,b)=>b.conf-a.conf);
    return top5;
}
function shuffle(arr){
    const copy = [...arr];
    for(let i=copy.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]] = [copy[j],copy[i]];
    }
    return copy;
}

// ============ 关卡 ============
function loadLevel(lid){
    const lv = levelData.find(x=>x.id === lid);
    if(!lv) return;
    currentLevelId = lid;
    const elLid = document.getElementById("lid");
    const elZh = document.getElementById("targetZh");
    const elEn = document.getElementById("targetEn");
    if(elLid) elLid.innerText = lv.id;
    if(elZh) elZh.innerText = lv.display_name;
    if(elEn) elEn.innerText = lv.class_name;
    clearCanvas();
    document.getElementById("msg").className = "";
    document.getElementById("msg").innerText = "绘制草图后点击提交";
    document.getElementById("top3Box").innerHTML = "";
    renderLevelList();
}
function renderLevelList(){
    let html = "";
    levelData.forEach(l=>{
        const passed = progress[l.id] && progress[l.id].passed;
        html += `<span class="level-tag ${passed?'passed':''}" onclick="loadLevel(${l.id})">${l.id}.${l.display_name}</span>`;
    });
    document.getElementById("levelBox").innerHTML = html;
    const passedNum = Object.values(progress).filter(p=>p.passed).length;
    document.getElementById("passCount").innerText = passedNum;
    document.getElementById("totalLevel").innerText = levelData.length;
}
function initChain(){
    const keys = Object.keys(chainDict);
    const letter = keys[Math.floor(Math.random()*keys.length)];
    const wordList = chainDict[letter];
    const word = wordList[Math.floor(Math.random()*wordList.length)];
    chainState = {requiredLetter:letter, startWord:word};
    document.getElementById("modeHint").innerText =
        `词语接龙：上一词 ${word}，请画【${letter.toUpperCase()}】开头的物品`;
    clearCanvas();
    document.getElementById("msg").className = "";
    document.getElementById("msg").innerText = "绘制草图后提交接龙";
    document.getElementById("top3Box").innerHTML = "";
}

// ============ 模式切换 ============
document.querySelectorAll(".mode-btn").forEach(btn=>{
    btn.onclick = function(){
        document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
        currentMode = this.dataset.mode;
        document.getElementById("msg").className = "";
        const progPanel = document.getElementById("progressPanel");
        const lvPanel = document.getElementById("levelListPanel");

        if(currentMode === "challenge"){
            progPanel.style.display = "block";
            lvPanel.style.display = "block";
            document.getElementById("modeTitle").innerText = "闯关模式";
            document.getElementById("modeHint").innerHTML =
                `当前关卡：<span id="lid">${currentLevelId}</span>｜请画：` +
                `<span id="targetZh">${levelData[currentLevelId-1].display_name}</span>` +
                `（<span id="targetEn">${levelData[currentLevelId-1].class_name}</span>）`;
            loadLevel(currentLevelId);
        }else if(currentMode === "chain"){
            progPanel.style.display = "none";
            lvPanel.style.display = "none";
            document.getElementById("modeTitle").innerText = "词语接龙";
            initChain();
        }else if(currentMode === "practice"){
            progPanel.style.display = "none";
            lvPanel.style.display = "none";
            document.getElementById("modeTitle").innerText = "练习模式";
            document.getElementById("modeHint").innerText = "自由绘图，只看预测结果，不计闯关";
            clearCanvas();
            document.getElementById("msg").innerText = "绘制草图后点击提交";
            document.getElementById("top3Box").innerHTML = "";
        }
    };
});

// ============ 提交 ============
document.getElementById("submitBtn").onclick = function(){
    if(currentMode === "challenge"){
        const lv = levelData.find(l=>l.id === currentLevelId);
        const top5 = mockPredict(strokes, lv.class_name);
        const top3 = top5.slice(0,3);
        const top1 = top5[0];
        const ok = top1.class_name === lv.class_name && top1.conf >= lv.pass_threshold;
        if(!progress[lv.id]) progress[lv.id] = {attempts:0, passed:false};
        progress[lv.id].attempts += 1;
        if(ok) progress[lv.id].passed = true;
        const names = top3.map(x=>x.display_name);
        if(ok){
            document.getElementById("msg").className = "success";
            document.getElementById("msg").innerText = `识别${lv.display_name}成功，准备开启下一轮...`;
            document.getElementById("top3Box").innerHTML = "";
            setTimeout(()=>{
                if(currentLevelId < levelData.length) loadLevel(currentLevelId+1);
            },1600);
        }else{
            document.getElementById("msg").className = "fail";
            document.getElementById("msg").innerText = `识别${lv.display_name}失败，你画的可能是：${names.join("、")}`;
            document.getElementById("top3Box").innerHTML = "";
        }
        renderLevelList();
    }else if(currentMode === "chain"){
        const top5 = mockPredict(strokes, "star");
        const req = chainState.requiredLetter.toLowerCase();
        const match = top5.find(x=>x.class_name.startsWith(req) && x.conf >= 0.15);
        const top3Names = top5.slice(0,3).map(x=>x.display_name);
        if(match){
            document.getElementById("msg").className = "success";
            document.getElementById("msg").innerText = `识别${match.display_name}成功，准备开启下一轮...`;
            document.getElementById("top3Box").innerHTML = "";
            setTimeout(()=>initChain(),1600);
        }else{
            document.getElementById("msg").className = "fail";
            document.getElementById("msg").innerText = `识别失败，你画的可能是：${top3Names.join("、")}`;
            document.getElementById("top3Box").innerHTML = "";
        }
    }else if(currentMode === "practice"){
        const top5 = mockPredict(strokes, "star");
        const top3Names = top5.slice(0,3).map(x=>x.display_name);
        document.getElementById("msg").className = "";
        document.getElementById("msg").innerText = `预测结果：${top3Names.join("、")}`;
        document.getElementById("top3Box").innerHTML = "";
    }
};

loadLevel(1);
</script>
